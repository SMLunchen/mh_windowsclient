name: Build & Release

on:
  push:
    branches: [ '**' ]      # Tests auf jedem Branch-Push, nicht nur master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Bei schnellen Folge-Pushes auf denselben Branch den älteren Lauf abbrechen (spart Runner-Minuten)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Runs on every push to master and every PR. Release build depends on this,
  # so a red test suite blocks the release.
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MeshhessenClient.sln

      - name: Test
        run: dotnet test MeshhessenClient.sln -c Release --no-restore --verbosity normal

  build:
    runs-on: windows-latest
    needs: test
    # Only publish/release on a version tag or a manual run – not on every branch push
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore MeshhessenClient/MeshhessenClient.csproj

      - name: Publish standalone EXE
        # TILE_AUTH_TOKEN is a repo secret, injected only into official release builds.
        # On a fork (no secret) it resolves empty → tokenless build, which is intended.
        run: dotnet publish MeshhessenClient/MeshhessenClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:TileAuthToken=${{ secrets.TILE_AUTH_TOKEN }} -o publish_output

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Meshhessen Client ${{ github.ref_name }}
          body: |
            ## Meshhessen Client ${{ github.ref_name }}

            Windows-Client for Meshtastic-devices – developed from [Meshhessen Community](https://www.meshhessen.de).

            ### Download
            👇 simply download and run  `MeshhessenClient.exe` - no install necessary!

            ### Prequisites
            - Windows 10/11 x64
            - Meshtastic-device with USB, BLE or wifi
            - dotnet Download: https://dotnet.microsoft.com/en-us/download/dotnet/8.0

            ### no cloud, no registration, all offline
          files: publish_output/MeshhessenClient.exe
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
