# Baut das Handbuch (MkDocs Material) aus docs/de + docs/en und committet den
# fertigen HTML-Output nach docs/handbuch/ — GitHub Pages (Branch-Modus, /docs)
# liefert es dann unter meshhessenclient.de/handbuch/ aus.
# --strict lässt den Build bei kaputten internen Links fehlschlagen → der
# Link-Check läuft damit automatisch bei jedem Doku-Push.
name: Handbuch bauen

on:
  push:
    branches: [master]
    paths:
      - 'docs/**/*.md'
      - 'requirements-docs.txt'
      - 'docs/*.md'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'mkdocs_overrides/**'
      - '.github/workflows/handbuch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned docs toolchain
        run: pip install -r requirements-docs.txt

      - name: Build German site (strict = Link-Check inklusive)
        run: mkdocs build --strict -d site_handbuch

      - name: Build English site
        run: mkdocs build --strict -f mkdocs.en.yml -d site_handbuch_en

      - name: Publish into docs/handbuch (EN nested under /en/)
        run: |
          rm -rf docs/handbuch
          mv site_handbuch docs/handbuch
          rm -rf docs/handbuch/en
          mv site_handbuch_en docs/handbuch/en
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/handbuch
          if git diff --cached --quiet; then
            echo "Handbuch unverändert — nichts zu committen."
          else
            git commit -m "docs: Handbuch neu gebaut (MkDocs)"
            git push
          fi
